{{- if .Values.ingress.enabled }}
{{- $routes := list (list "dashboard" "dashboard" 80) (list "n8n" "n8n" 80) (list "api" "api" 8000) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "churn.name" . }}
  labels:
    {{- include "churn.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ include "churn.name" . }}-tls
      hosts:
        {{- range $routes }}
        - {{ include "churn.host" (dict "root" $ "key" (index . 0)) | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ include "churn.host" (dict "root" $ "key" (index . 0)) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "churn.name" $ }}-{{ index . 1 }}
                port: {number: {{ index . 2 }}}
    {{- end }}
{{- end }}
