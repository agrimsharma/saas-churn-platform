apiVersion: v1
kind: Secret
metadata:
  name: {{ include "churn.name" . }}-secrets
  labels:
    {{- include "churn.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ required "secrets.apiKey" .Values.secrets.apiKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: "postgresql://churn:{{ .Values.secrets.postgresPassword }}@{{ include "churn.name" . }}-db:5432/churn"
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
