name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
          POSTGRES_DB: churn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U churn" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # the public IBM Telco dataset has the same columns the model uses
      CHURN_DATA_PATH: data/raw/Telco-Customer-Churn.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fetch IBM Telco churn data
        run: |
          mkdir -p data/raw
          curl -fsSL -o "$CHURN_DATA_PATH" \
            https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
      - run: python -m pytest tests -q
      - name: n8n workflows are in sync with their generator
        run: |
          python n8n/build_workflows.py
          git diff --exit-code n8n/workflows

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api dashboard
