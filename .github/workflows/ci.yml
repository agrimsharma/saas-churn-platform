name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
          POSTGRES_DB: churn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U churn" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # the public IBM Telco dataset has the same columns the model uses
      CHURN_DATA_PATH: data/raw/Telco-Customer-Churn.csv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fetch IBM Telco churn data
        run: |
          mkdir -p data/raw
          curl -fsSL -o "$CHURN_DATA_PATH" \
            https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
      - run: python -m pytest tests -q
      - name: n8n workflows are in sync with their generator
        run: |
          python n8n/build_workflows.py
          git diff --exit-code n8n/workflows deploy/helm/churn-platform/files/workflows

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api dashboard

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: lint + render + schema check (kind and AKS values)
        run: |
          CHART=deploy/helm/churn-platform
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for target in kind aks; do
            args="-f $CHART/values-$target.yaml --set secrets.apiKey=ci --set secrets.postgresPassword=ci --set api.complaintsModel.hub=ci/model"
            helm lint "$CHART" $args
            helm template ci "$CHART" $args > rendered-$target.yaml
            ./kubeconform -summary -ignore-missing-schemas rendered-$target.yaml   # ServiceMonitor is a CRD
          done
